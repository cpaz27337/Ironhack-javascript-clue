name: Deploy fitness-app to GitHub Pages

on:
  push:
    branches:
      - claude/body-scan-fitness-app-92x1fc
    paths:
      - 'fitness-app/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload fitness-app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fitness-app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
